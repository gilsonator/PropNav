<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Property Navigator Map - Upgrade Demo</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="57x57" href="/icons/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="/icons/apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="/icons/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="/icons/apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="/icons/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192"  href="/icons/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB02R4laQio9VntvjvSDk92KsT5PNH15b0&callback=load"
      async
      defer
    ></script>
    <script src="scripts/map.js"></script>
    <style>
      body {
        border: 0;
        margin: 0;
        background-color: #d6ecfb;
        font-family: 'Roboto', Arial, sans-serif;
      }

      #mapDiv, #streetViewDiv {
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        border-bottom: 2px solid #00a8ec;
      }

      #mapDiv {
        height: 570px;
      }

      #streetViewDiv {
        height: 250px;
        display: none;
      }

      .controls {
        padding: 2px;
        height: 20px;
        max-width: 800px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .controls div {
        font-size: 12pt;
      }

      .controls input {
        margin-left: 4px;
      }

      @media print {
        input {
          display: none;
        }
      }
    </style>
  </head>
  <body onload="load()">
    <div id="mapDiv"></div>
    <div id="streetViewDiv"></div>
    <div class="controls">
      <div id="addrDiv"></div>
      <div>
        <input id="cmdStreetView" type="button" value="Show Street View" onclick="showStreetView()" />
        <input id="cmdPrint" type="button" value="Print Map" onclick="cmdPrint_onclick()" />
        <input id="cmdClose" type="button" value="Close" onclick="window.close()" />
      </div>
    </div>
  </body>
</html>
